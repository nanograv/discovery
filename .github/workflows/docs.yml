name: Build and Deploy Documentation

on:
  push:
    branches:
      - '**'        # build docs for every branch, not just main
      - '!gh-pages' # never build from the published site itself
  pull_request:
    branches:
      - main

permissions:
  contents: write

# gh-pages is a single branch: serialize deploys so two branches pushed at
# once do not race each other's commits.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -e ".[docs]"

      - name: Build documentation
        run: |
          cd docs
          make html

      - name: Deploy to GitHub Pages (main branch)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html
          publish_branch: gh-pages
          destination_dir: .
          keep_files: true

      - name: Deploy to GitHub Pages (feature branches)
        if: github.ref != 'refs/heads/main' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html
          publish_branch: gh-pages
          destination_dir: branches/${{ github.ref_name }}
          keep_files: true

      - name: Link to the rendered docs
        if: github.event_name == 'push'
        run: |
          base="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          if [ "${{ github.ref_name }}" = "main" ]; then
            url="$base/"
          else
            url="$base/branches/${{ github.ref_name }}/"
          fi
          echo "### Rendered documentation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[$url]($url)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "_Pages can take a minute to refresh after the deploy._" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact (for PRs)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: documentation-pr-${{ github.event.pull_request.number }}
          path: docs/_build/html
